[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbcheck"
dynamic = ["version"]
description = "An auditor of pseudoreplication in single-cell RNA-seq differential expression analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Alexander Poliakov", email = "s4s4spol@gmail.com" }]
keywords = ["single-cell", "scRNA-seq", "differential-expression", "pseudoreplication", "pseudobulk", "statistics", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "anndata>=0.13",
    "scanpy>=1.12",
    "statsmodels",
    "pydeseq2>=0.5.4",
    "decoupler>=2.0",
]

[project.optional-dependencies]
# Only needed to run the real-data audit against the CELLxGENE Census.
census = ["cellxgene-census"]
# Only needed for the (not-yet-built) HTML report; nothing in src/ imports these (grepped, R3).
report = ["jinja2", "matplotlib", "tqdm"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/s4s4s4s/pbcheck"
Repository = "https://github.com/s4s4s4s/pbcheck"
Issues = "https://github.com/s4s4s4s/pbcheck/issues"

[tool.hatch.version]
path = "src/pbcheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pbcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Targeted, not blanket (R3): audited with `pytest -q -W default` after temporarily disabling the
# per-test-file `warnings.filterwarnings("ignore")` calls (which would otherwise mask everything).
# Exactly one warning fires anywhere in the suite: anndata's ImplicitModificationWarning when the
# synthetic oracles build an AnnData from an obs frame with a default integer index
# (`synthetic/oracles.py`'s `ad.AnnData(X=X, obs=obs)`, before `obs_names` is set explicitly).
# Its reported source module is CPython's `functools` (the singledispatch wrapper anndata's own
# warning call routes through), not anndata or the oracle module, so no module qualifier is used —
# matching on it would be pinning an internal dispatch implementation detail. Neither FutureWarning
# nor DeprecationWarning fires anywhere in the suite as of this stack (requirements.lock), so the
# previous blanket ignores of both were silencing nothing here; anything real from a future numpy /
# pandas / scanpy upgrade will now surface instead of being swallowed.
filterwarnings = [
    "ignore:Transforming to str index\\.:anndata._warnings.ImplicitModificationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
